services:
  postgres:
    container_name: postgres
    restart: always
    image: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./backend/Doou.Api/data/postgres:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
networks:
  default:
    name: local-network
